architectury {
    common("fabric", "forge")
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    // Architectury API
    modImplementation("dev.architectury:architectury:9.2.14")
    compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")

    // Cloth Config (编译时，运行时由平台模块提供)
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:11.1.106")
}
